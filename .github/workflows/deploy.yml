name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # O companion (companion/) é a fonte única; aqui só é copiado para dentro do site publicado,
      # para o app oferecer o instalador em .../OmniDrive/companion/instalar-companion.bat
      - name: Incluir o companion no site
        run: |
          mkdir -p app/companion
          cp companion/omnidrive-smart.py companion/iniciar-smart.bat companion/instalar-companion.bat companion/LEIAME.txt app/companion/
          # hashes para o instalador conferir o que baixou (formato do sha256sum)
          (cd app/companion && sha256sum omnidrive-smart.py iniciar-smart.bat instalar-companion.bat LEIAME.txt > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
