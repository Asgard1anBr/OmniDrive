<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081019">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/ http://localhost:7777 http://127.0.0.1:7777; frame-src https://accounts.google.com/gsi/; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>OmniDrive</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/omnidrive-icon.png">
  <link rel="apple-touch-icon" href="icons/omnidrive-icon.png">
  <link rel="stylesheet" href="css/styles.css?v=2.12.1">
</head>
<body>
  <div id="stars" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <img src="icons/omnidrive-icon.png" alt="" class="brand-logo">
      <span>OMNI<b>DRIVE</b></span>
    </div>
    <div class="topbar-right">
      <button class="hdr-report" id="btnRelatorio" title="Gerar relatório">📄 Relatório</button>
      <span class="ver" id="appVer">v2.12.1</span>
      <button class="hdr-refresh" id="btnAtualizar" title="Forçar atualização da versão">↻</button>
      <button class="avatar" id="btnSobre" title="Sobre">i</button>
    </div>
  </header>

  <nav class="topnav">
    <button class="navbtn" data-view="dashboard"><span>▦</span>Painel</button>
    <button class="navbtn" data-view="busca"><span>⌕</span>Busca</button>
    <button class="navbtn" data-view="cadastro"><span>＋</span>Novo</button>
    <button class="navbtn" id="btnScan"><span>▣</span>Ler QR</button>
  </nav>

  <div class="ld-bar" id="ldBar">
    <button class="btn ld-main" id="btnLerDrive">💽 Ler drive</button>
    <button class="ld-help" id="btnCompanionAjuda">Primeira vez neste computador? Instalar o companion</button>
  </div>

  <main id="app"><!-- telas renderizadas aqui --></main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/config.js?v=2.12.1"></script>
  <script src="js/cloud.js?v=2.12.1"></script>
  <script src="js/qr.js?v=2.12.1"></script>
  <script src="js/app.js?v=2.12.1"></script>
  <script src="js/sw-register.js?v=2.12.1"></script>
</body>
</html>
